# Surround Sound Studio - build the sample app, and publish a release for each version tag.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Adapted from ps5-homebrew-ui's own workflow. A tag that equals
# sample-app/sce_sys/param.json's contentVersion (NN.NNN.NNN) publishes a
# GitHub release with the app-folder ZIP (what ProsperoStore installs), the
# .ffpfsc image (ShadowMount+) and SHA256SUMS. A run started by hand only builds.

name: Release

on:
  push:
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sample-app

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/sample-app/.deps/ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 make ninja-build ccache pkg-config tar unzip wget

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            sample-app/.deps/native
            sample-app/.deps/ps5-opengl
            sample-app/.deps/MkPFS
          key: deps-${{ runner.os }}-ubuntu24-${{ hashFiles('sample-app/tools/setup-*-dependencies.sh', 'sample-app/tools/fetch-opengl-sdk.sh') }}

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: sample-app/.deps/ccache
          key: ccache-${{ runner.os }}-clang18-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang18-

      - name: Read app identity and version
        id: version
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "The tag must equal param.json contentVersion ($content_version)." >&2
            exit 2
          fi
          release=false
          [[ $GITHUB_REF_TYPE == tag ]] && release=true
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "version=$content_version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"

      - name: Reproduce the clean-room runtime and check it
        run: |
          make libc
          (cd runtime && sha256sum -c libc.prx.sha256)

      - name: Build the app folder, ZIP and .ffpfsc
        run: make ffpfsc

      # The console only starts an app whose files are open to all (CE-107750-0 otherwise).
      - name: Check the ZIP
        run: |
          python3 - "dist/$TITLE_ID.zip" "$TITLE_ID" <<'PY'
          import sys, zipfile
          archive, title = sys.argv[1:3]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "damaged entry"
              names = z.namelist()
              assert all(n.startswith(title + "/") for n in names), "entries outside the app folder"
              assert title + "/eboot.bin" in names, "no eboot.bin"
              assert title + "/assets/clips/index.txt" in names, "no clip index"
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              print(f"{archive}: {len(names)} entries, all 0777")
          PY

      - name: Write checksums
        run: cd dist && sha256sum "$TITLE_ID.zip" "$TITLE_ID.ffpfsc" > SHA256SUMS && cat SHA256SUMS

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: surround-sound-studio-${{ github.sha }}
          path: |
            sample-app/dist/${{ env.TITLE_ID }}.zip
            sample-app/dist/${{ env.TITLE_ID }}.ffpfsc
            sample-app/dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: sample-app/RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Download the verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "surround-sound-studio-$GITHUB_SHA" --dir release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          assets=(release/PPSA*.zip release/PPSA*.ffpfsc release/SHA256SUMS)
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VERSION" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Surround Sound Studio v$VERSION" \
              --notes-file sample-app/RELEASE_NOTES.md \
              --latest
          fi
